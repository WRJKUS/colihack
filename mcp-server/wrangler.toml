name = "einvoice-wolf"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret config. The seller identity is read from these on Workers (no
# filesystem for seller.json). TOOL_PREFIX namespaces the tools as wolf_*.
[vars]
TOOL_PREFIX = "wolf_"
SELLER_NAME = "collibra-hack"
SELLER_VAT = "BE0999787908"
SENDER_PEPPOL_SCHEME = "0208"
SENDER_PEPPOL_ID = "0999787908"
SELLER_ADDRESS = "Avenue Louise 143, 1050 Bruxelles"

# Secrets (NOT stored here) — set before deploy:
#   wrangler secret put EINVOICE_API_KEY
#   wrangler secret put MCP_AUTH_SECRET
